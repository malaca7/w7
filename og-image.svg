<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E120E" />
      <stop offset="50%" stop-color="#080A08" />
      <stop offset="100%" stop-color="#050705" />
    </linearGradient>
    <linearGradient id="w7Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A6FF00" />
      <stop offset="100%" stop-color="#50C800" />
    </linearGradient>
    <radialGradient id="aurora" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#A6FF00" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#50C800" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#080A08" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <circle cx="600" cy="200" r="500" fill="url(#aurora)" />

  <!-- Grid lines overlay -->
  <path d="M 0 150 H 1200 M 0 300 H 1200 M 0 450 H 1200 M 300 0 V 630 M 600 0 V 630 M 900 0 V 630" stroke="rgba(255,255,255,0.035)" stroke-width="1" />

  <!-- Glass container -->
  <rect x="150" y="85" width="900" height="460" rx="36" fill="rgba(18,24,18,0.7)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- W7 Logo mark (badge filled with gradient and white text inside) -->
  <g transform="translate(530, 140)">
    <rect width="140" height="140" rx="36" fill="url(#w7Grad)" filter="url(#glow)" />
    <text x="70" y="98" font-family="System-UI, -apple-system, sans-serif" font-weight="900" font-size="82" fill="#FFFFFF" text-anchor="middle">W7</text>
  </g>

  <!-- Title -->
  <text x="600" y="355" font-family="System-UI, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">
    W7 — Atendimento Inteligente via WhatsApp
  </text>

  <!-- Subtitle -->
  <text x="600" y="415" font-family="System-UI, -apple-system, sans-serif" font-weight="500" font-size="22" fill="#94A3B8" text-anchor="middle">
    Plataforma SaaS Premium Multi-Empresa com CRM, Chatbot Visual e Financeiro
  </text>

  <!-- Badge -->
  <g transform="translate(480, 460)">
    <rect width="240" height="40" rx="20" fill="rgba(166,255,0,0.12)" stroke="rgba(166,255,0,0.35)" stroke-width="1" />
    <text x="120" y="25" font-family="System-UI, -apple-system, sans-serif" font-weight="600" font-size="15" fill="#A6FF00" text-anchor="middle">
      w7.com.br
    </text>
  </g>
</svg>
